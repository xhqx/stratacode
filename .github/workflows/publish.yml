name: publish
run-name: "${{ format('{0} {1}', inputs.pre_release && 'pre-release' || 'release', inputs.bump) }}"

on:
  # push:
  #   branches:
  #     - ci
  #     - dev
  #     - beta
  #     - snapshot-*
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Override version (optional)"
        required: false
        type: string
      pre_release:
        description: "Publish as pre-release (VS Code marketplace + npm rc channel)"
        required: false
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  version:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.repository == 'Strata-Org/stratacode'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      # stratacode_change start - install deps for version script workspace resolution
      - name: Install dependencies
        run: bun install

      - name: Install Strata
        if: inputs.bump || inputs.version
        run: bun i -g @stratacode/cli
      # stratacode_change end

      - id: version
        run: |
          ./script/version.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STRATA_BUMP: ${{ inputs.bump }}
          STRATA_VERSION: ${{ inputs.version }}
          STRATA_PRE_RELEASE: ${{ inputs.pre_release }}
          STRATA_API_KEY: ${{ secrets.STRATA_API_KEY }}
          STRATA_ORG_ID: ${{ secrets.STRATA_ORG_ID }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}

  build-cli:
    needs: version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.repository == 'Strata-Org/stratacode'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build
        id: build
        run: |
          ./packages/opencode/script/build.ts
        env:
          STRATA_VERSION: ${{ needs.version.outputs.version }}
          STRATA_RELEASE: ${{ needs.version.outputs.release }}
          STRATA_PRE_RELEASE: ${{ inputs.pre_release }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: strata-cli
          path: packages/opencode/dist

    outputs:
      version: ${{ needs.version.outputs.version }}

  build-vscode:
    needs: build-cli
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.repository == 'Strata-Org/stratacode'
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install @vscode/vsce
        run: bun install -g @vscode/vsce

      - uses: actions/download-artifact@v4
        with:
          name: strata-cli
          path: packages/opencode/dist

      - name: Build VSIX packages
        run: bun script/build.ts
        working-directory: ./packages/strata-vscode
        env:
          CLI_DIST_DIR: ../../packages/opencode/dist
          STRATA_VERSION: ${{ needs.build-cli.outputs.version }}
          STRATA_PRE_RELEASE: ${{ inputs.pre_release }}
          GH_REPO: ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: strata-vscode
          path: packages/strata-vscode/out

