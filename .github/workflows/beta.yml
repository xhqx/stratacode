name: beta

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  sync:
    if: github.repository == 'Strata-Org/stratacode'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Git Committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          # stratacode_change start
          strata-maintainer-app-id: ${{ secrets.STRATA_MAINTAINER_APP_ID }}
          strata-maintainer-app-secret: ${{ secrets.STRATA_MAINTAINER_APP_SECRET }}
          # stratacode_change end

      - name: Sync beta branch
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: bun script/beta.ts
