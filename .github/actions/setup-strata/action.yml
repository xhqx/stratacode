# stratacode_change - new file
name: "Setup Strata"
description: "Install Strata CLI globally"
runs:
  using: "composite"
  steps:
    - name: Install Strata CLI
      run: curl -fsSL https://strata.ai/cli/install | bash
      shell: bash

    - name: Add Strata to PATH
      run: echo "$HOME/.strata/bin" >> $GITHUB_PATH
      shell: bash
